name: OSS-Fuzz integration test
# Builds the fuzzers the way OSS-Fuzz does and fuzzes briefly. This runs on the runners
# the Micronaut organization shares, not on Google infrastructure, and takes 60 to 90
# minutes, so it runs nightly rather than on every push. The build uses micronaut-core's
# default branch, so it checks this repository against the current core more than it
# checks any single commit here.
on:
  schedule:
    - cron: '0 2 * * *'
  workflow_dispatch:
# At most one build at a time; a manual run started meanwhile waits for it.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false
jobs:
  Run-OSS-Fuzz:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    permissions:
      security-events: write
    steps:
      - name: Build fuzzers
        id: build
        uses: google/oss-fuzz/infra/cifuzz/actions/build_fuzzers@master
        with:
          oss-fuzz-project-name: micronaut
          language: 'jvm'
      - name: Run Fuzzers
        uses: google/oss-fuzz/infra/cifuzz/actions/run_fuzzers@master
        with:
          oss-fuzz-project-name: micronaut
          # Split evenly between the targets, rounded down. With fewer seconds than targets,
          # each target gets 0 seconds and run_fuzzers fails.
          fuzz-seconds: '300'
          output-sarif: true
          language: 'jvm'
      - name: Upload SARIF
        if: always() && steps.build.outcome == 'success'
        uses: github/codeql-action/upload-sarif@v4
        with:
          sarif_file: cifuzz-sarif/results.sarif
          checkout_path: cifuzz-sarif
